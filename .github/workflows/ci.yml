name: CI

# Every push and PR: run tests and build on macOS, Windows and Linux.
# Pushing a tag like v1.2.0 also publishes the builds to GitHub Releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: AutoClicker-macos-arm64.zip
          - os: windows-latest
            asset: AutoClicker-windows-x64.zip
          - os: ubuntu-latest
            asset: AutoClicker-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      # Tag name without the leading "v" for tagged builds, 0.0.0 otherwise.
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          APP_VERSION="${APP_VERSION#v}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          # Linux has no system web view Python can bundle, so the Linux build ships Qt WebEngine.
          if [ "$RUNNER_OS" = "Linux" ]; then extra="[qt]"; fi
          pip install ".${extra}" pyinstaller

      - name: Build
        run: pyinstaller --noconfirm packaging/autoclicker.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/AutoClicker.app "${{ matrix.asset }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/AutoClicker.exe -DestinationPath "${{ matrix.asset }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.asset }}" -C dist AutoClicker

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
