<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e303d"/>
      <stop offset="1" stop-color="#1b1c25"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- repeat-click waves off the left button -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round">
    <path d="M300 330 A150 150 0 0 1 400 240"/>
    <path d="M225 330 A225 225 0 0 1 400 165" opacity=".5"/>
  </g>
  <!-- mouse body, button split and scroll wheel -->
  <rect x="400" y="272" width="340" height="520" rx="170" fill="#ffffff"/>
  <path d="M570 272 V470 M400 470 H740" stroke="#1b1c25" stroke-width="18"/>
  <rect x="554" y="330" width="32" height="76" rx="16" fill="#1b1c25"/>
